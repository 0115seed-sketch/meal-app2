name: Auto Update School Meal

on:
  schedule:
    # KST 04:17 최초 실행, 05:17 / 06:17 / 07:17 재시도
    # 당일 성공 기록이 있으면 예약 실행은 업데이트를 건너뜁니다.
    - cron: '17 19,20,21,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-meal-update
  cancel-in-progress: false

jobs:
  update-meal:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Check today's successful update
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today=$(TZ=Asia/Seoul date +'%Y-%m-%d')
          echo "date=$today" >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = "schedule" ] && [ -f .meal-update-success ] && [ "$(cat .meal-update-success)" = "$today" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Today's update already succeeded; skipping."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow

      - name: Download Korean Font
        if: steps.check.outputs.run == 'true'
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 -o NanumGothic.ttf https://github.com/google/fonts/raw/main/ofl/nanumgothic/NanumGothic-Regular.ttf

      - name: Run meal update script
        if: steps.check.outputs.run == 'true'
        env:
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
        run: python update_meal.py

      - name: Record successful update
        if: steps.check.outputs.run == 'true'
        env:
          UPDATE_DATE: ${{ steps.check.outputs.date }}
        run: printf '%s\n' "$UPDATE_DATE" > .meal-update-success

      - name: Commit and Push changes
        if: steps.check.outputs.run == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f NanumGothic.ttf
          git add -A index.html images .meal-update-success
          if git diff --cached --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi
          git commit -m "Auto-update meal data: $(date -u -d '+9 hours' +'%Y-%m-%d')"
          git push
